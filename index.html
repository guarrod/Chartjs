<!DOCTYPE html>
<html>
<head>
    <title>Line Chart Interpolation Modes</title>
    <style>
        canvas {
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
        }
    </style>
</head>
<body>
    <div style="width:753px; height:300px;">
        <canvas id="myChart"></canvas>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
const DATA_COUNT = 12;
const labels = [];
for (let i = 0; i < DATA_COUNT; ++i) {
  labels.push(i.toString());
}
const datapoints = [0, 20, 20, 60, 60, 120, 50, 180, 120, 125, 105, 110, 170];
const datapoints2 = [0, 10, 120, 160, 60, 20, 80, 180, 10, 25, 5, 10, 170];
const datapoints3 = [0, 60, 300, 50, 80, 100, 180, 280, 300, 250, 50, 100, 17];
const data = {
  labels: labels,
  datasets: [
    {
      label: 'Cubic interpolation (monotone)',
      data: datapoints,
      borderColor: 'rgba(200, 223, 253, 1)',
      fill: 'origin',
      backgroundColor: function(context) {
        const chart = context.chart;
        const {ctx, chartArea} = chart;

        if (!chartArea) {
          // This case happens on initial chart load when chartArea is not yet available
          return null;
        }

        let borderColor = context.dataset.borderColor;
        let colorOpaque = 'rgba(0,0,0,0.5)'; // Default fallback
        let colorTransparent = 'rgba(0,0,0,0)'; // Default fallback

        if (typeof borderColor === 'string' && borderColor.startsWith('rgba(')) {
          // Simple parsing for 'rgba(r,g,b,a)' format
          const parts = borderColor.substring(borderColor.indexOf('(') + 1, borderColor.lastIndexOf(')')).split(',');
          if (parts.length === 4) {
            const r = parts[0].trim();
            const g = parts[1].trim();
            const b = parts[2].trim();
            colorOpaque = `rgba(${r},${g},${b},0.5)`;
            colorTransparent = `rgba(${r},${g},${b},0)`;
          }
        } else if (typeof borderColor === 'string' && borderColor.startsWith('#')) {
          // Basic hex to rgba conversion (assumes #RRGGBB or #RGB)
          let r = 0, g = 0, b = 0;
          if (borderColor.length === 7) { // #RRGGBB
              r = parseInt(borderColor.substring(1, 3), 16);
              g = parseInt(borderColor.substring(3, 5), 16);
              b = parseInt(borderColor.substring(5, 7), 16);
          } else if (borderColor.length === 4) { // #RGB
              r = parseInt(borderColor.substring(1, 2) + borderColor.substring(1, 2), 16);
              g = parseInt(borderColor.substring(2, 3) + borderColor.substring(2, 3), 16);
              b = parseInt(borderColor.substring(3, 4) + borderColor.substring(3, 4), 16);
          }
          colorOpaque = `rgba(${r},${g},${b},0.5)`;
          colorTransparent = `rgba(${r},${g},${b},0)`;
        }


        const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
        gradient.addColorStop(0, colorOpaque);
        gradient.addColorStop(1, colorTransparent);
        return gradient;
      },
      cubicInterpolationMode: 'monotone',
      tension: 0.2,
      pointRadius: 2,
      pointBorderWidth: 3,
      pointHoverRadius: 8,
      pointBackgroundColor: 'rgba(200, 223, 253, 1)',
      pointHoverBorderWidth: 5,
      pointHoverBackgroundColor: 'rgb(210, 0, 110)',
      pointHoverBorderColor: 'rgb(255, 255, 255)'
    }, {
      label: 'Cubic interpolation',
      data: datapoints2,
      borderColor: 'rgba(246, 204, 226, 1)',
      fill: 'origin',
      backgroundColor: function(context) {
        const chart = context.chart;
        const {ctx, chartArea} = chart;

        if (!chartArea) {
          // This case happens on initial chart load when chartArea is not yet available
          return null;
        }

        let borderColor = context.dataset.borderColor;
        let colorOpaque = 'rgba(0,0,0,0.5)'; // Default fallback
        let colorTransparent = 'rgba(0,0,0,0)'; // Default fallback

        if (typeof borderColor === 'string' && borderColor.startsWith('rgba(')) {
          // Simple parsing for 'rgba(r,g,b,a)' format
          const parts = borderColor.substring(borderColor.indexOf('(') + 1, borderColor.lastIndexOf(')')).split(',');
          if (parts.length === 4) {
            const r = parts[0].trim();
            const g = parts[1].trim();
            const b = parts[2].trim();
            colorOpaque = `rgba(${r},${g},${b},0.5)`;
            colorTransparent = `rgba(${r},${g},${b},0)`;
          }
        } else if (typeof borderColor === 'string' && borderColor.startsWith('#')) {
          // Basic hex to rgba conversion (assumes #RRGGBB or #RGB)
          let r = 0, g = 0, b = 0;
          if (borderColor.length === 7) { // #RRGGBB
              r = parseInt(borderColor.substring(1, 3), 16);
              g = parseInt(borderColor.substring(3, 5), 16);
              b = parseInt(borderColor.substring(5, 7), 16);
          } else if (borderColor.length === 4) { // #RGB
              r = parseInt(borderColor.substring(1, 2) + borderColor.substring(1, 2), 16);
              g = parseInt(borderColor.substring(2, 3) + borderColor.substring(2, 3), 16);
              b = parseInt(borderColor.substring(3, 4) + borderColor.substring(3, 4), 16);
          }
          colorOpaque = `rgba(${r},${g},${b},0.5)`;
          colorTransparent = `rgba(${r},${g},${b},0)`;
        }


        const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
        gradient.addColorStop(0, colorOpaque);
        gradient.addColorStop(1, colorTransparent);
        return gradient;
      },
      tension: 0.2,
      pointRadius: 2,
      pointBorderWidth: 3,
      pointHoverRadius: 8,
      pointBackgroundColor: 'rgba(246, 204, 226, 1)',
      pointHoverBorderWidth: 5,
      pointHoverBackgroundColor: 'rgb(210, 0, 110)',
      pointHoverBorderColor: 'rgb(255, 255, 255)'
    }, {
      label: 'Linear interpolation (default)',
      data: datapoints3,
      borderColor: 'rgba(205, 236, 215, 1)',
      fill: 'origin',
      backgroundColor: function(context) {
        const chart = context.chart;
        const {ctx, chartArea} = chart;

        if (!chartArea) {
          // This case happens on initial chart load when chartArea is not yet available
          return null;
        }

        let borderColor = context.dataset.borderColor;
        let colorOpaque = 'rgba(0,0,0,0.5)'; // Default fallback
        let colorTransparent = 'rgba(0,0,0,0)'; // Default fallback

        if (typeof borderColor === 'string' && borderColor.startsWith('rgba(')) {
          // Simple parsing for 'rgba(r,g,b,a)' format
          const parts = borderColor.substring(borderColor.indexOf('(') + 1, borderColor.lastIndexOf(')')).split(',');
          if (parts.length === 4) {
            const r = parts[0].trim();
            const g = parts[1].trim();
            const b = parts[2].trim();
            colorOpaque = `rgba(${r},${g},${b},0.5)`;
            colorTransparent = `rgba(${r},${g},${b},0)`;
          }
        } else if (typeof borderColor === 'string' && borderColor.startsWith('#')) {
          // Basic hex to rgba conversion (assumes #RRGGBB or #RGB)
          let r = 0, g = 0, b = 0;
          if (borderColor.length === 7) { // #RRGGBB
              r = parseInt(borderColor.substring(1, 3), 16);
              g = parseInt(borderColor.substring(3, 5), 16);
              b = parseInt(borderColor.substring(5, 7), 16);
          } else if (borderColor.length === 4) { // #RGB
              r = parseInt(borderColor.substring(1, 2) + borderColor.substring(1, 2), 16);
              g = parseInt(borderColor.substring(2, 3) + borderColor.substring(2, 3), 16);
              b = parseInt(borderColor.substring(3, 4) + borderColor.substring(3, 4), 16);
          }
          colorOpaque = `rgba(${r},${g},${b},0.5)`;
          colorTransparent = `rgba(${r},${g},${b},0)`;
        }


        const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
        gradient.addColorStop(0, colorOpaque);
        gradient.addColorStop(1, colorTransparent);
        return gradient;
      },
      tension: 0.2,
      pointRadius: 2,
      pointBorderWidth: 3,
      pointHoverRadius: 8,
      pointBackgroundColor: 'rgba(205, 236, 215, 1)',
      pointHoverBorderWidth: 5,
      pointHoverBackgroundColor: 'rgb(210, 0, 110)',
      pointHoverBorderColor: 'rgb(255, 255, 255)'
    }
  ]
};

// Refactored Background image plugin
const chartAreaBackgroundImagePlugin = {
  id: 'chartAreaBackgroundImage',
  _backgroundImage: null, // To store the Image object
  _imageLoaded: false,    // To track if the image has loaded successfully
  _imageError: false,     // To track if there was an error loading

  // Initialize the image object and start loading
  // This 'afterInit' hook runs once per chart instance after initialization.
  afterInit: (chart) => {
    const imageUrl = chart.config.options.plugins.chartAreaBackgroundImage && chart.config.options.plugins.chartAreaBackgroundImage.image;
    if (imageUrl) {
      chartAreaBackgroundImagePlugin._backgroundImage = new Image();
      chartAreaBackgroundImagePlugin._backgroundImage.src = imageUrl;

      chartAreaBackgroundImagePlugin._backgroundImage.onload = () => {
        chartAreaBackgroundImagePlugin._imageLoaded = true;
        // Request a redraw now that the image is loaded
        // This is important if the chart drew before the image was ready
        chart.draw();
      };
      chartAreaBackgroundImagePlugin._backgroundImage.onerror = () => {
        chartAreaBackgroundImagePlugin._imageError = true;
        console.error('Error loading background image for chart: ' + imageUrl);
      };
    }
  },

  beforeDraw: (chart) => {
    // Only draw if the image is loaded and there was no error
    if (chartAreaBackgroundImagePlugin._imageLoaded && !chartAreaBackgroundImagePlugin._imageError && chartAreaBackgroundImagePlugin._backgroundImage) {
      const ctx = chart.ctx;
      const chartArea = chart.chartArea;
      if (chartArea) { // Ensure chartArea is defined
        ctx.drawImage(
          chartAreaBackgroundImagePlugin._backgroundImage,
          chartArea.left,
          chartArea.top,
          chartArea.right - chartArea.left,
          chartArea.bottom - chartArea.top
        );
      }
    }
  },

  // Clean up when chart is destroyed (optional but good practice)
  afterDestroy: () => {
    chartAreaBackgroundImagePlugin._backgroundImage = null;
    chartAreaBackgroundImagePlugin._imageLoaded = false;
    chartAreaBackgroundImagePlugin._imageError = false;
  }
};

const ctx = document.getElementById('myChart').getContext('2d');
const myChart = new Chart(ctx, {
    type: 'line',
    data: data,
    options: {
        responsive: true,
        maintainAspectRatio: false, // Add this line
        plugins: {
            title: {
                display: true,
                text: 'Chart.js Line Chart Interpolation Modes'
            },
            tooltip: {
                mode: 'index',
                intersect: false,
            },
            legend: {
                position: 'bottom',
            },
            chartAreaBackgroundImage: { // Added configuration for the image
              image: 'https://i.ibb.co/nX5JJbR/dotgrid.png'
            }
        },
        scales: {
            x: { // Add or modify x-axis configuration
                grid: {
                    display: false // Hide x-axis grid lines
                }
            },
            y: {
                beginAtZero: true,
                grid: {
                    display: false // Hide y-axis grid lines
                }
            }
        }
    },
    plugins: [chartAreaBackgroundImagePlugin] // Register the plugin instance here (top-level)
});
    </script>
</body>
</html>
