<!DOCTYPE html>
<html>
<head>
    <title>Line Chart Interpolation Modes</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito Sans', sans-serif;
        }
        canvas {
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
        }
        .custom-legend-item:hover {
          opacity: 0.85; /* Slight feedback on hover */
        }
    </style>
</head>
<body>
    <div style="width:753px; height:300px;">
        <canvas id="myChart"></canvas>
    </div>
    <div id="customLegendContainer" style="display: flex; flex-wrap: wrap; justify-content: flex-start; margin-top: 10px;"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
Chart.defaults.font.family = "'Nunito Sans', sans-serif";
const today = new Date();
const currentDayOfMonth = today.getDate(); // Day number (1-31)

// DATA_COUNT will now be the current day of the month.
// This means the chart will show data up to the current day.
// It's assumed the user's actual data arrays (datapoints, datapoints2, datapoints3)
// will be populated with a length matching currentDayOfMonth by their external data source.
// If static example data is shorter, lines will end early. If longer, extra data is ignored.
const DATA_COUNT = currentDayOfMonth;

const labels = [];
for (let i = 1; i <= DATA_COUNT; ++i) { // Labels from 1 up to currentDayOfMonth
  labels.push(i.toString());
}
const datapoints = [0, 20, 20, 60, 60, 120, 50, 180, 120, 125, 105, 110, 170];
const datapoints2 = [0, 10, 120, 160, 60, 20, 80, 180, 10, 25, 5, 10, 170];
const datapoints3 = [0, 60, 300, 50, 80, 100, 180, 280, 300, 250, 50, 100, 17];
const data = {
  labels: labels,
  datasets: [
    {
      label: 'CTE - 9786875',
      data: datapoints,
      borderColor: 'rgba(200, 223, 253, 1)',
      fill: 'origin',
      backgroundColor: function(context) {
        const chart = context.chart;
        const {ctx, chartArea} = chart;

        if (!chartArea) {
          // This case happens on initial chart load when chartArea is not yet available
          return null;
        }

        let borderColor = context.dataset.borderColor;
        let colorOpaque = 'rgba(0,0,0,0.5)'; // Default fallback
        let colorTransparent = 'rgba(0,0,0,0)'; // Default fallback

        if (typeof borderColor === 'string' && borderColor.startsWith('rgba(')) {
          // Simple parsing for 'rgba(r,g,b,a)' format
          const parts = borderColor.substring(borderColor.indexOf('(') + 1, borderColor.lastIndexOf(')')).split(',');
          if (parts.length === 4) {
            const r = parts[0].trim();
            const g = parts[1].trim();
            const b = parts[2].trim();
            colorOpaque = `rgba(${r},${g},${b},0.5)`;
            colorTransparent = `rgba(${r},${g},${b},0)`;
          }
        } else if (typeof borderColor === 'string' && borderColor.startsWith('#')) {
          // Basic hex to rgba conversion (assumes #RRGGBB or #RGB)
          let r = 0, g = 0, b = 0;
          if (borderColor.length === 7) { // #RRGGBB
              r = parseInt(borderColor.substring(1, 3), 16);
              g = parseInt(borderColor.substring(3, 5), 16);
              b = parseInt(borderColor.substring(5, 7), 16);
          } else if (borderColor.length === 4) { // #RGB
              r = parseInt(borderColor.substring(1, 2) + borderColor.substring(1, 2), 16);
              g = parseInt(borderColor.substring(2, 3) + borderColor.substring(2, 3), 16);
              b = parseInt(borderColor.substring(3, 4) + borderColor.substring(3, 4), 16);
          }
          colorOpaque = `rgba(${r},${g},${b},0.5)`;
          colorTransparent = `rgba(${r},${g},${b},0)`;
        }


        const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
        gradient.addColorStop(0, colorOpaque);
        gradient.addColorStop(1, colorTransparent);
        return gradient;
      },
      cubicInterpolationMode: 'monotone',
      tension: 0.2,
      pointRadius: 2,
      pointBorderWidth: 3,
      pointHoverRadius: 8,
      pointBackgroundColor: 'rgba(200, 223, 253, 1)',
      pointHoverBorderWidth: 5,
      pointHoverBackgroundColor: 'rgb(210, 0, 110)',
      pointHoverBorderColor: 'rgb(255, 255, 255)'
    }, {
      label: 'CTA - 8975687',
      data: datapoints2,
      borderColor: 'rgba(246, 204, 226, 1)',
      fill: 'origin',
      backgroundColor: function(context) {
        const chart = context.chart;
        const {ctx, chartArea} = chart;

        if (!chartArea) {
          // This case happens on initial chart load when chartArea is not yet available
          return null;
        }

        let borderColor = context.dataset.borderColor;
        let colorOpaque = 'rgba(0,0,0,0.5)'; // Default fallback
        let colorTransparent = 'rgba(0,0,0,0)'; // Default fallback

        if (typeof borderColor === 'string' && borderColor.startsWith('rgba(')) {
          // Simple parsing for 'rgba(r,g,b,a)' format
          const parts = borderColor.substring(borderColor.indexOf('(') + 1, borderColor.lastIndexOf(')')).split(',');
          if (parts.length === 4) {
            const r = parts[0].trim();
            const g = parts[1].trim();
            const b = parts[2].trim();
            colorOpaque = `rgba(${r},${g},${b},0.5)`;
            colorTransparent = `rgba(${r},${g},${b},0)`;
          }
        } else if (typeof borderColor === 'string' && borderColor.startsWith('#')) {
          // Basic hex to rgba conversion (assumes #RRGGBB or #RGB)
          let r = 0, g = 0, b = 0;
          if (borderColor.length === 7) { // #RRGGBB
              r = parseInt(borderColor.substring(1, 3), 16);
              g = parseInt(borderColor.substring(3, 5), 16);
              b = parseInt(borderColor.substring(5, 7), 16);
          } else if (borderColor.length === 4) { // #RGB
              r = parseInt(borderColor.substring(1, 2) + borderColor.substring(1, 2), 16);
              g = parseInt(borderColor.substring(2, 3) + borderColor.substring(2, 3), 16);
              b = parseInt(borderColor.substring(3, 4) + borderColor.substring(3, 4), 16);
          }
          colorOpaque = `rgba(${r},${g},${b},0.5)`;
          colorTransparent = `rgba(${r},${g},${b},0)`;
        }


        const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
        gradient.addColorStop(0, colorOpaque);
        gradient.addColorStop(1, colorTransparent);
        return gradient;
      },
      tension: 0.2,
      pointRadius: 2,
      pointBorderWidth: 3,
      pointHoverRadius: 8,
      pointBackgroundColor: 'rgba(246, 204, 226, 1)',
      pointHoverBorderWidth: 5,
      pointHoverBackgroundColor: 'rgb(210, 0, 110)',
      pointHoverBorderColor: 'rgb(255, 255, 255)'
    }, {
      label: 'CTE - 3627896',
      data: datapoints3,
      borderColor: 'rgba(205, 236, 215, 1)',
      fill: 'origin',
      backgroundColor: function(context) {
        const chart = context.chart;
        const {ctx, chartArea} = chart;

        if (!chartArea) {
          // This case happens on initial chart load when chartArea is not yet available
          return null;
        }

        let borderColor = context.dataset.borderColor;
        let colorOpaque = 'rgba(0,0,0,0.5)'; // Default fallback
        let colorTransparent = 'rgba(0,0,0,0)'; // Default fallback

        if (typeof borderColor === 'string' && borderColor.startsWith('rgba(')) {
          // Simple parsing for 'rgba(r,g,b,a)' format
          const parts = borderColor.substring(borderColor.indexOf('(') + 1, borderColor.lastIndexOf(')')).split(',');
          if (parts.length === 4) {
            const r = parts[0].trim();
            const g = parts[1].trim();
            const b = parts[2].trim();
            colorOpaque = `rgba(${r},${g},${b},0.5)`;
            colorTransparent = `rgba(${r},${g},${b},0)`;
          }
        } else if (typeof borderColor === 'string' && borderColor.startsWith('#')) {
          // Basic hex to rgba conversion (assumes #RRGGBB or #RGB)
          let r = 0, g = 0, b = 0;
          if (borderColor.length === 7) { // #RRGGBB
              r = parseInt(borderColor.substring(1, 3), 16);
              g = parseInt(borderColor.substring(3, 5), 16);
              b = parseInt(borderColor.substring(5, 7), 16);
          } else if (borderColor.length === 4) { // #RGB
              r = parseInt(borderColor.substring(1, 2) + borderColor.substring(1, 2), 16);
              g = parseInt(borderColor.substring(2, 3) + borderColor.substring(2, 3), 16);
              b = parseInt(borderColor.substring(3, 4) + borderColor.substring(3, 4), 16);
          }

        }

      },
      tension: 0.2,
      pointRadius: 2,
      pointBorderWidth: 3,
      pointHoverRadius: 8,
      pointBackgroundColor: 'rgba(205, 236, 215, 1)',
      pointHoverBorderWidth: 5,
      pointHoverBackgroundColor: 'rgb(210, 0, 110)',
      pointHoverBorderColor: 'rgb(255, 255, 255)'
    }
  ]
};

// Refactored Background image plugin
const chartAreaBackgroundImagePlugin = {
  id: 'chartAreaBackgroundImage',
  _backgroundImage: null, // To store the Image object
  _imageLoaded: false,    // To track if the image has loaded successfully
  _imageError: false,     // To track if there was an error loading

  // Initialize the image object and start loading
  // This 'afterInit' hook runs once per chart instance after initialization.
  afterInit: (chart) => {
    const imageUrl = chart.config.options.plugins.chartAreaBackgroundImage && chart.config.options.plugins.chartAreaBackgroundImage.image;
    if (imageUrl) {
      chartAreaBackgroundImagePlugin._backgroundImage = new Image();
      chartAreaBackgroundImagePlugin._backgroundImage.src = imageUrl;

      chartAreaBackgroundImagePlugin._backgroundImage.onload = () => {
        chartAreaBackgroundImagePlugin._imageLoaded = true;
        // Request a redraw now that the image is loaded
        // This is important if the chart drew before the image was ready
        chart.draw();
      };
      chartAreaBackgroundImagePlugin._backgroundImage.onerror = () => {
        chartAreaBackgroundImagePlugin._imageError = true;
        console.error('Error loading background image for chart: ' + imageUrl);
      };
    }
  },

  beforeDraw: (chart) => {
    // Only draw if the image is loaded and there was no error
    if (chartAreaBackgroundImagePlugin._imageLoaded && !chartAreaBackgroundImagePlugin._imageError && chartAreaBackgroundImagePlugin._backgroundImage) {
      const ctx = chart.ctx;
      const chartArea = chart.chartArea;
      if (chartArea) { // Ensure chartArea is defined
        ctx.drawImage(
          chartAreaBackgroundImagePlugin._backgroundImage,
          chartArea.left,
          chartArea.top,
          chartArea.right - chartArea.left,
          chartArea.bottom - chartArea.top
        );
      }
    }
  },

  // Clean up when chart is destroyed (optional but good practice)
  afterDestroy: () => {
    chartAreaBackgroundImagePlugin._backgroundImage = null;
    chartAreaBackgroundImagePlugin._imageLoaded = false;
    chartAreaBackgroundImagePlugin._imageError = false;
  }
};

const ctx = document.getElementById('myChart').getContext('2d');
const myChart = new Chart(ctx, {
    type: 'line',
    data: data,
    options: {
        responsive: true,
        maintainAspectRatio: false, // Add this line
        plugins: {
            title: {
                display: false,
                text: 'Chart.js Line Chart Interpolation Modes' // Text can remain, it just won't be shown
            },
            tooltip: {
                mode: 'nearest', // Changed
                intersect: true,  // Changed
                backgroundColor: '#ffffff',
                padding: 16,
                titleColor: '#000000',
                bodyColor: '#000000',
                titleFont: {
                    size: 22
                },
                bodyFont: {
                    size: 14
                },
                usePointStyle: true,
                boxPadding: 3, // Added here
                borderColor: 'rgba(0,0,0,0.1)', // Added
                borderWidth: 1,               // Added
                callbacks: { // Updated
                    title: function(tooltipItems) {
                        // tooltipItems is an array, but with mode 'nearest' and intersect true, it's usually one item.
                        if (tooltipItems.length > 0) {
                            const item = tooltipItems[0];
                            const value = Number(item.parsed.y);
                            if (item.parsed.y !== null) {
                                 return '$' + value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                            }
                        }
                        return ''; // Return empty string if no item or no value
                    },
                    label: function(tooltipItem) {
                        // Just return the dataset label
                        return tooltipItem.dataset.label || '';
                    }
                }
            },
            legend: {
                display: false
            },
            chartAreaBackgroundImage: { // Added configuration for the image
              image: 'https://i.ibb.co/nX5JJbR/dotgrid.png'
            }
        },
        scales: {
            x: { // Add or modify x-axis configuration
                grid: {
                    display: false // Hide x-axis grid lines
                },
                ticks: {
                    color: '#8A869F',
                    callback: function(value, index, ticks) {
                        // `value` is the original tick value (label from `data.labels` array, e.g., "1", "2")
                        // `this.getLabelForValue(index)` also gives the label string.
                        const tickValueNumber = parseInt(this.getLabelForValue(index), 10);
                        const visibleTicks = [5, 10, 15, 20, 25, 30];

                        // Only show the tick if it's in our list AND less than or equal to currentDayOfMonth
                        // (currentDayOfMonth is available in the outer scope from the code above)
                        if (visibleTicks.includes(tickValueNumber) && tickValueNumber <= currentDayOfMonth) {
                            return tickValueNumber.toString(); // Return the string label
                        } else {
                            return null; // Hide other ticks
                        }
                    }
                },
                border: { // Add this
                    display: false
                }
            },
            y: {
                beginAtZero: true,
                grid: {
                    display: false // Hide y-axis grid lines
                },
                ticks: {
                    color: '#8A869F' // Color for y-axis labels
                },
                border: { // Add this
                    display: false
                }
            }
        }
    },
    plugins: [chartAreaBackgroundImagePlugin] // Register the plugin instance here (top-level)
});

const customLegendContainer = document.getElementById('customLegendContainer');

function generateCustomLegend() {
  // Clear existing legend items
  customLegendContainer.innerHTML = '';

  myChart.data.datasets.forEach((dataset, index) => {
    const legendItem = document.createElement('div');
    legendItem.classList.add('custom-legend-item');
    legendItem.style.backgroundColor = dataset.borderColor; // Use dataset's borderColor for background
    legendItem.style.borderRadius = '4px';
    legendItem.style.padding = '3px 8px';
    legendItem.style.margin = '5px';
    legendItem.style.color = '#121212'; // White text color - assuming backgrounds will be dark enough
    legendItem.style.fontSize = '14px'; // Added
    legendItem.style.cursor = 'pointer';
    legendItem.style.display = 'inline-flex'; // Use flex for alignment if adding a swatch
    legendItem.style.alignItems = 'center';

    // Dataset label text
    const text = document.createTextNode(dataset.label);

    // Strike-through if dataset is hidden
    if (!myChart.isDatasetVisible(index)) {
      legendItem.style.textDecoration = 'line-through';
      legendItem.style.opacity = '0.7'; // Dim if hidden
    }

    legendItem.appendChild(text);

    // Click event to toggle dataset visibility
    legendItem.onclick = () => {
      myChart.setDatasetVisibility(index, !myChart.isDatasetVisible(index));
      myChart.update();
      generateCustomLegend(); // Regenerate legend to reflect style changes (e.g., strike-through)
    };

    customLegendContainer.appendChild(legendItem);
  });
}

// Initial generation of the legend
generateCustomLegend();

// Optional: if you have plugins that might add/remove datasets dynamically,
// you might need to regenerate the legend. For this case, it's likely not needed.
// For instance, an observer on myChart.data.datasets could trigger regenerateCustomLegend().
    </script>
</body>
</html>
